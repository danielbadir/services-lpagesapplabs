name: checks

# A2/A3 under Master Rules: this site is publicly released, so tests and linting
# are hard gates, not advisory. No npm, no build step — the site has none and the
# checks should not introduce one.
#
# A3 scope — stated precisely, because this comment previously claimed a compliance
# the file did not implement. Until 2026-07-28 this workflow ran no validator of any
# kind while asserting A3 was met; the V8 review caught it. What runs now is the
# `html-structure` rule in .ci/check.py: a dependency-free structural validator built
# on Python's stdlib HTMLParser. It checks tag balance, duplicate ids, duplicate
# attributes, void-element misuse, dangling aria-controls/labelledby references, and
# ambiguous ampersands.
#
# It is NOT a full W3C conformance checker. That needs the vnu jar — Java plus a
# network fetch on every run, which would add the first dependency this site has ever
# had and could fail closed, exactly like the live-header job removed below. If full
# conformance is wanted later, run vnu manually during review rather than in CI.
on:
  push:
    branches: [main, subdomeniu1]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static checks (CSP integrity, links, legal freshness, a11y basics, HTML structure)
        run: python3 .ci/check.py

  secrets:
    # GitHub gives secret scanning and push protection free on PUBLIC repos only,
    # so the platform's private repos have no server-side detection at all.
    # .githooks/pre-commit is the primary control and refuses the commit outright,
    # but it depends on `git config core.hooksPath .githooks` — LOCAL config that
    # does not survive a clone (R31). This job is the backstop for the two ways the
    # hook gets bypassed: `--no-verify`, and a checkout that never set hooksPath.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hook is present and executable
        run: |
          test -x .githooks/pre-commit \
            || { echo "::error::.githooks/pre-commit missing or not executable"; exit 1; }
      - name: Hook self-test — its own controls must still fire
        # R26/R35: proves the patterns detect real secrets AND ignore this site's own
        # prose about cryptography. A scanner nobody has proven can fail is not a check.
        run: .githooks/pre-commit --selftest
      - name: Scan the tracked tree
        run: |
          PAT='(BEGIN [A-Z ]*PRIVATE KEY|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{32,}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN OPENSSH|aws_secret_access_key[[:space:]]*=)'
          echo 'AKIAIOSFODNN7EXAMPLE' | grep -qE "$PAT" \
            || { echo "::error::scanner is blind — positive control failed"; exit 1; }
          # The detector files define these patterns, so they match themselves.
          # The hook carries the identical exemption; without it CI is red forever
          # (R28). The hole: a secret hidden inside these two files is not caught
          # here, so read their diffs by eye.
          DETECTORS='^(\.githooks/pre-commit|\.github/workflows/[a-z-]+\.yml)$'
          scanned=$(git ls-files | grep -vE "$DETECTORS")
          if printf '%s\n' "$scanned" | tr '\n' '\0' \
               | xargs -0 grep -lEI "$PAT" 2>/dev/null | grep .; then
            echo "::error::secret pattern found in tracked files (listed above)"
            exit 1
          fi
          echo "no secret patterns in $(printf '%s\n' "$scanned" | wc -l) scanned files"
      - name: Internal documents must never be tracked
        # Rule 23: Review_V6.md was once live and downloadable at the apex.
        run: |
          if git ls-files | grep -E '^(Review_V[0-9]+\.md|OWNER_ACTIONS\.md|backlog\.md)$'; then
            echo "::error::internal document is tracked — it would deploy"
            exit 1
          fi
          echo "no internal documents tracked"

# The live-header assertion that used to live here was removed 2026-07-27.
# Cloudflare serves a bot challenge to GitHub Actions runners, so it failed on
# every single run since it was added — the site was correct the whole time.
# A CI that is permanently red teaches you to ignore CI, which is worse than
# not having it. Live headers are verified manually during review instead
# (Master Rules v6.7 makes deploy-path/live verification a required review step).
