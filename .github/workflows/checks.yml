name: checks

# A2/A3 under Master Rules: this site is publicly released, so tests and linting
# are hard gates, not advisory. No npm, no build step — the site has none and the
# checks should not introduce one.
on:
  push:
    branches: [main, subdomeniu1]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static checks (CSP integrity, links, legal freshness, a11y basics)
        run: python3 .ci/check.py

# The live-header assertion that used to live here was removed 2026-07-27.
# Cloudflare serves a bot challenge to GitHub Actions runners, so it failed on
# every single run since it was added — the site was correct the whole time.
# A CI that is permanently red teaches you to ignore CI, which is worse than
# not having it. Live headers are verified manually during review instead
# (Master Rules v6.7 makes deploy-path/live verification a required review step).
