name: checks

# A2/A3 under Master Rules: this site is publicly released, so tests and linting
# are hard gates, not advisory. No npm, no build step — the site has none and the
# checks should not introduce one.
#
# A3 scope — stated precisely, because this comment previously claimed a compliance
# the file did not implement. Until 2026-07-28 this workflow ran no validator of any
# kind while asserting A3 was met; the V8 review caught it. What runs now is the
# `html-structure` rule in .ci/check.py: a dependency-free structural validator built
# on Python's stdlib HTMLParser. It checks tag balance, duplicate ids, duplicate
# attributes, void-element misuse, dangling aria-controls/labelledby references, and
# ambiguous ampersands.
#
# It is NOT a full W3C conformance checker. That needs the vnu jar — Java plus a
# network fetch on every run, which would add the first dependency this site has ever
# had and could fail closed, exactly like the live-header job removed below. If full
# conformance is wanted later, run vnu manually during review rather than in CI.
on:
  push:
    branches: [main, subdomeniu1]
  pull_request:
  workflow_dispatch:
# Least privilege, declared here rather than inherited. The repository default is
# currently `read`, which is correct -- but that is an ACCOUNT setting, flipped in
# one click and invisible from the code. Declaring it in the workflow pins it in
# version control where a reviewer can see it, and it survives someone changing
# the default later. Both jobs below only read the tree: they run a Python script
# and grep the checkout. Nothing here writes, comments, or publishes.
permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA, not by tag. A tag is mutable: whoever controls the
      # action can repoint v4 at different code, and every run picks it up
      # silently. The SHA is what actually executes. Update deliberately --
      # resolve the new tag with `gh api repos/<a>/commits/<tag> --jq .sha` and
      # change both the SHA and the version comment in the same edit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.12'
      - name: JavaScript must parse
        # Added 2026-09-04. check.py treats .js as TEXT -- substring matching only,
        # no parser, no AST. A stray brace in main.js shipped with a fully green
        # build, and nothing downstream would notice until a person opened the page.
        # That is the same class as the 2026-07-27 blank-page outage on all nine
        # origins, which was found by the owner looking at the site.
        # node is preinstalled on ubuntu-latest, so this adds no dependency.
        #
        # COLLECTS FROM THE TRACKED TREE, not a glob -- corrected 2026-09-06.
        # This step originally used `files=(public/*.js)`, written in the SAME
        # session in which .ci/check.py was converted away from glob() to
        # `git ls-files` for exactly this reason. `public/*.js` is not recursive,
        # so a tracked public/js/foo.js would be skipped silently while the step
        # still found other files and exited 0 -- the failure looks like success.
        # Harmless on the day it was written only because every repo happened to
        # keep its JavaScript flat; that is a coincidence, not a control (R29/R54).
        run: |
          # Portable collector: `mapfile` is bash 4+, and this repository's own
          # author machine runs bash 3.2, so mapfile could not be executed even
          # once before shipping. A step whose whole purpose is not being
          # silently broken must not itself be untestable (R24).
          files=(); while IFS= read -r l; do files+=("$l"); done < <(git ls-files '*.js')
          # Assert the input before trusting the output (R24): an empty list would
          # make this step pass silently and read exactly like a clean tree.
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::no tracked .js files found — this check is blind"; exit 2
          fi
          for f in "${files[@]}"; do node --check "$f" || exit 1; done
          echo "parsed ${#files[@]} tracked JavaScript file(s) with node --check"
      - name: Static checks (CSP integrity, links, legal freshness, a11y basics, HTML structure)
        run: python3 .ci/check.py

  secrets:
    # GitHub gives secret scanning and push protection free on PUBLIC repos only,
    # so the platform's private repos have no server-side detection at all.
    # .githooks/pre-commit is the primary control and refuses the commit outright,
    # but it depends on `git config core.hooksPath .githooks` — LOCAL config that
    # does not survive a clone (R31). This job is the backstop for the two ways the
    # hook gets bypassed: `--no-verify`, and a checkout that never set hooksPath.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - name: Hook is present and executable
        run: |
          test -x .githooks/pre-commit \
            || { echo "::error::.githooks/pre-commit missing or not executable"; exit 1; }
      - name: Hook self-test — its own controls must still fire
        # R26/R35: proves the patterns detect real secrets AND ignore this site's own
        # prose about cryptography. A scanner nobody has proven can fail is not a check.
        run: .githooks/pre-commit --selftest
      - name: Scan the tracked tree
        run: |
          PAT='(BEGIN [A-Z ]*PRIVATE KEY|ghp_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{22,}|AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{32,}|xox[baprs]-[A-Za-z0-9-]{10,}|-----BEGIN OPENSSH|aws_secret_access_key[[:space:]]*=)'
          echo 'AKIAIOSFODNN7EXAMPLE' | grep -qE "$PAT" \
            || { echo "::error::scanner is blind — positive control failed"; exit 1; }
          # The detector files define these patterns, so they match themselves.
          # The hook carries the identical exemption; without it CI is red forever
          # (R28). The hole: a secret hidden inside these two files is not caught
          # here, so read their diffs by eye.
          DETECTORS='^(\.githooks/pre-commit|\.github/workflows/[a-z-]+\.yml)$'
          scanned=$(git ls-files | grep -vE "$DETECTORS")
          if printf '%s\n' "$scanned" | tr '\n' '\0' \
               | xargs -0 grep -lEI "$PAT" 2>/dev/null | grep .; then
            echo "::error::secret pattern found in tracked files (listed above)"
            exit 1
          fi
          echo "no secret patterns in $(printf '%s\n' "$scanned" | wc -l) scanned files"
      - name: Internal documents must never be tracked
        # Rule 23: Review_V6.md was once live and downloadable at the apex.
        run: |
          if git ls-files | grep -E '^(Review_V[0-9]+\.md|OWNER_ACTIONS\.md|backlog\.md)$'; then
            echo "::error::internal document is tracked — it would deploy"
            exit 1
          fi
          echo "no internal documents tracked"

      - name: No second origin — GitHub Pages must stay disabled
        # R23/R38. Cloudflare Pages serves this repo with the full `_headers`
        # posture. GitHub Pages, if switched on, serves the SAME committed files
        # from github.io — and it supports no `_headers`, no `.htaccess` and no
        # header config of any kind, so that gap cannot be closed in place. The
        # only way to close it is to stay off.
        #
        # Found live 2026-09-04 on two of the nine repos (ai-crypto-highflags and
        # services), enabled at some point and forgotten. Root URLs 404, but one
        # path deeper the whole site was live: /public/index.html 200, and
        # /public/privacy.html 200 carrying the company registration number —
        # with no CSP, no frame-ancestors, no nosniff, no Referrer-Policy, no
        # Permissions-Policy and no COOP. Deleting the two was a one-time fix
        # that nothing guarded; this step is the control that outlives it.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          hp=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.has_pages' 2>/dev/null)
          # R24: an unreadable field must report BROKEN, never PASS. Without this
          # case, an auth failure returns empty — and empty is not "false".
          case "$hp" in
            true|false) ;;
            *) echo "::error::BROKEN — could not read .has_pages (got '$hp'). Believe nothing below."; exit 2 ;;
          esac
          if [ "$hp" = "true" ]; then
            echo "::error::GitHub Pages is ENABLED — a second origin is serving this repo without _headers. Close it with: gh api -X DELETE repos/$GITHUB_REPOSITORY/pages"
            exit 1
          fi
          echo "GitHub Pages disabled — single origin confirmed"

# The live-header assertion that used to live here was removed 2026-07-27.
# Cloudflare serves a bot challenge to GitHub Actions runners, so it failed on
# every single run since it was added — the site was correct the whole time.
# A CI that is permanently red teaches you to ignore CI, which is worse than
# not having it. Live headers are verified manually during review instead
# (Master Rules v6.7 makes deploy-path/live verification a required review step).
