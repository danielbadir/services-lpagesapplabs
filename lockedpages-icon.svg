<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="a" cx="50%" cy="38%" r="68%">
      <stop offset="0%" stop-color="#0E1C36"/>
      <stop offset="100%" stop-color="#030810"/>
    </radialGradient>
    <!-- lock body: top of body (y=420) → bottom (y=810) -->
    <linearGradient id="b" x1="0" y1="420" x2="0" y2="810" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#3EFCB8"/>
      <stop offset="50%"  stop-color="#0EC888"/>
      <stop offset="100%" stop-color="#00825A"/>
    </linearGradient>
    <!-- shackle: top of arch (y=196) → bottom of legs (y=508) -->
    <linearGradient id="c" x1="0" y1="196" x2="0" y2="508" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#90FFE0"/>
      <stop offset="55%"  stop-color="#1EE898"/>
      <stop offset="100%" stop-color="#08C078"/>
    </linearGradient>
    <!-- documents: navy -->
    <linearGradient id="d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#243470"/>
      <stop offset="100%" stop-color="#1A285C"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1024" height="1024" rx="210" fill="url(#a)"/>

  <!-- back document (right-shifted, dog-ear corner) -->
  <rect x="350" y="568" width="374" height="295" rx="28" fill="url(#d)"/>
  <polygon points="690,568 724,568 724,602" fill="#101D44"/>

  <!-- front document -->
  <rect x="296" y="596" width="420" height="292" rx="28" fill="#1D2C62"/>
  <rect x="340" y="820" width="265" height="14" rx="7" fill="#2B3D7A"/>
  <rect x="340" y="852" width="196" height="14" rx="7" fill="#2B3D7A"/>
  <rect x="340" y="878" width="232" height="14" rx="7" fill="#2B3D7A"/>

  <!-- shackle (drawn before lock body so body covers the legs) -->
  <path d="M368 508 L368 360 C368 196 654 196 654 360 L654 508"
        fill="none" stroke="url(#c)" stroke-width="84" stroke-linecap="round"
        stroke-linejoin="round"/>
  <!-- shackle highlight -->
  <path d="M384 500 L384 368 C384 218 638 218 638 368 L638 458"
        fill="none" stroke="rgba(255,255,255,.22)" stroke-width="13" stroke-linecap="round"/>

  <!-- lock body (covers shackle legs) -->
  <rect x="246" y="420" width="530" height="390" rx="90" fill="url(#b)"/>
  <!-- top-edge highlight -->
  <rect x="246" y="420" width="530" height="124" rx="90" fill="rgba(255,255,255,.10)"/>
  <!-- left ambient glow -->
  <ellipse cx="280" cy="615" rx="38" ry="110" fill="rgba(255,255,255,.07)"/>

  <!-- keyhole -->
  <circle cx="511" cy="590" r="49" fill="#0A1322"/>
  <rect x="492" y="626" width="38" height="58" rx="19" fill="#0A1322"/>
</svg>
